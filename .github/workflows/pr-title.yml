# Pull requests are squash-merged, so the title becomes the commit on main that release-please reads. It has to be a
# Conventional Commit: feat: ..., fix: ..., perf: ..., docs: ..., chore: ..., with a ! for a breaking change.
name: PR title
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
permissions:
  pull-requests: read
jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            refactor
            test
            build
            ci
            chore
          requireScope: false
