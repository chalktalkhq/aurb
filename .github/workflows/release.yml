# Publishing a GitHub release tagged v<version> publishes that version to npm, with provenance, once the tests pass.
# No token: npm trusts this workflow through Trusted Publishing (set on npmjs.com under aurb, Settings, Trusted
# Publisher: GitHub Actions, chalktalkhq/aurb, release.yml). That needs npm 11.5.1 or later.
name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Trusted Publishing and provenance: npm checks this run's identity, and the package links back to it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, registry-url: "https://registry.npmjs.org" }
      - name: The tag matches package.json
        run: test "${{ github.event.release.tag_name }}" = "v$(node -p 'require("./package.json").version')"
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public --ignore-scripts # tested above, on Windows
